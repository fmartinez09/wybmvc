<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>San Valentín Meadow</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <div id="overlay-ui">
        <p id="scroll-hint">Desliza para avanzar</p>
        <article id="love-card" aria-label="Tarjeta romántica">
          <div class="card-inner">
            <div class="card-face">
               <img class="card-cover" src="/cat-love.svg" alt="Ilustración romántica de fondo" />
              <img class="card-success-image" src="/yes-love.JPG" alt="Imagen de celebración de San Valentín" />
              <div class="heart-rain" aria-hidden="true"></div>
              <div class="card-content">
                <p class="card-kicker">Edición Especial ⭐⭐⭐⭐⭐</p>
                <h1>Mi Catalina hermosa</h1>
                <p class="card-sign">¿Quieres ser mi san valentín? 💖</p>
                <button class="card-yes-button" type="button">Sí</button>
                <p id="relationship-counter" aria-live="polite">0 años 0 meses 0 dias 0 horas 0 minutos y 0 segundos desde que estamos juntos</p>
              </div>
          </div>
        </article>
      </div>

      <div id="scroll-container" aria-hidden="true">
        <section class="scroll-section"></section>
        <section class="scroll-section"></section>
        <section class="scroll-section"></section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
